[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numprep"
version = "1.0.0"
description = "Production-grade, reproducible, containerized preprocessing pipeline for messy numeric datasets (audit, clean, split, fit-on-train-only, export)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Data Platform Engineering" }]
keywords = ["mlops", "preprocessing", "etl", "data-quality", "scikit-learn", "polars"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "polars>=1.19,<3",
    "pyarrow>=14,<27",
    "pydantic>=2.5,<3",
    "PyYAML>=6,<7",
    "typer>=0.12,<1",
    "joblib>=1.3,<2",
    "pandera>=0.20,<0.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "hypothesis>=6.100,<7",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2,<4",
    "types-PyYAML>=6",
]

[project.scripts]
numprep = "numprep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
numprep = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
]
ignore = [
    "SIM108",  # ternary is not always clearer
    "RUF012",  # mutable class attrs are fine for sklearn estimator class attrs
    "RUF001",  # we deliberately use typographic dashes/arrows in strings
    "RUF002",  # ... and in docstrings
    "RUF003",  # ... and in comments
]

[tool.ruff.lint.per-file-ignores]
# Typer's idiom is function-call defaults (typer.Option(...)) and lazy imports
# keep CLI startup fast; both are intentional.
"src/numprep/cli.py" = ["B008", "E402"]
# Development scripts may print and use ad-hoc imports.
"scripts/*" = ["T201", "E402"]
# Tests use subprocess-observed CLI values and fixtures with local imports.
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = ["src/numprep"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "pandera.*", "joblib.*", "scipy.*", "pyarrow.*", "polars.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning:pandera.*",
    "ignore::FutureWarning:pandera.*",
]

[tool.coverage.run]
source = ["src/numprep"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
