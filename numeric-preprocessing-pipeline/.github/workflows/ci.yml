name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff (lint + format)
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: mypy
        run: mypy

      - name: Pytest with coverage gate (85%)
        run: python -m pytest tests -p no:cacheprovider --cov=numprep --cov-report=term-missing --cov-fail-under=85

  docker-smoke-determinism:
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t numprep:local .

      # Porting to GitLab CI: replace this job's steps with a script: block
      # (image: docker:24, services: docker:dind) calling
      # bash scripts/docker_smoke_test.sh — the script is CI-agnostic and
      # exits non-zero on any gate failure.

      - name: Container smoke run on synthetic messy data
        run: bash scripts/docker_smoke_test.sh

      - name: Determinism gate (fresh containers, different hash seeds)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/.ci-data:/data:ro" -v "$PWD/.det-a:/a" \
            -e PYTHONHASHSEED=0 numprep:local run --input /data --output /a --log-level ERROR
          docker run --rm -v "$PWD/.ci-data:/data:ro" -v "$PWD/.det-b:/b" \
            -e PYTHONHASHSEED=1337 numprep:local run --input /data --output /b --log-level ERROR
          python scripts/compare_deterministic.py .det-a .det-b
          rm -rf .det-a .det-b
